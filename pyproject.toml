[project]
name = "coffee-health"
version = "0.1.0"
description = "Medallo take-home: load the coffee health dataset into Postgres and serve it with FastAPI"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "psycopg[binary,pool]>=3.2",
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "integration: needs the isolated Postgres from docker-compose.yml (127.0.0.1:5434)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "scripts", "tests"]
