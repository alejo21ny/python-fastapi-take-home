# Fixed project name, so containers and the volume (medallo-coffee-health_pgdata) never
# depend on the checkout directory and cannot collide with other projects.
name: medallo-coffee-health

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: coffee
    ports:
      # Loopback only. 5434 avoids the common 5432/5433 ports used by other local stacks.
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # *.sql files here run in filename order, only when the volume is first created.
      # Run `make db-reset` after adding or changing them.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d coffee"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
