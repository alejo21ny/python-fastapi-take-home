name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: coffee
        ports:
          - 5434:5432 # tests/conftest.py only accepts 127.0.0.1:5434/coffee_test
        options: >-
          --health-cmd "pg_isready -U postgres -d coffee"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5434/coffee
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5434/coffee_test

    defaults:
      run:
        shell: bash # -eo pipefail: a failing command before `| tee` fails the step

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python (.python-version) and the locked dependencies
        run: |
          uv python install
          uv sync --locked

      - name: Lint, format and type-check
        run: make lint

      # Every test is either marked `integration` or not, so these two steps run the
      # whole suite once. Both fail if any test was skipped.
      - name: Unit tests
        run: |
          make test-unit | tee "$RUNNER_TEMP/unit.log"
          if grep -Eq '[0-9]+ skipped' "$RUNNER_TEMP/unit.log"; then
            echo "::error::tests were skipped"; exit 1
          fi

      - name: Integration tests (rebuild coffee_test from db/init)
        run: |
          make test-integration | tee "$RUNNER_TEMP/integration.log"
          if grep -Eq '[0-9]+ skipped' "$RUNNER_TEMP/integration.log"; then
            echo "::error::tests were skipped"; exit 1
          fi

      - name: Load the dataset twice into the fresh coffee database
        run: |
          # Same as `make db-reset` on a new volume: apply db/init with the service's psql 17.
          for file in db/init/*.sql; do
            docker exec -i "${{ job.services.postgres.id }}" \
              psql -U postgres -d coffee -X -q -v ON_ERROR_STOP=1 < "$file"
          done
          make load | tee "$RUNNER_TEMP/first.log"
          grep -q "inserted 9971, updated 0, unchanged 0" "$RUNNER_TEMP/first.log"
          make load | tee "$RUNNER_TEMP/second.log"
          grep -q "inserted 0, updated 0, unchanged 9971" "$RUNNER_TEMP/second.log"
          grep -q "Rows in coffee_health: 9971" "$RUNNER_TEMP/second.log"

  # The documented delivery flow, exactly as a reviewer runs it:
  # make setup, make db-reset, make load, make dev, against docker-compose.yml.
  # No service container here, so Compose owns 127.0.0.1:5434 on this runner.
  compose-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Docker Compose is available
        run: docker compose version

      - name: Install Python (.python-version) and the locked dependencies
        run: |
          uv python install
          uv sync --locked

      - name: make setup
        run: |
          make setup
          test -f .env

      - name: make db-reset
        run: |
          make db-reset
          docker compose ps

      - name: make load
        run: |
          make load | tee "$RUNNER_TEMP/load.log"
          grep -q "inserted 9971, updated 0, unchanged 0" "$RUNNER_TEMP/load.log"
          grep -q "Rows in coffee_health: 9971" "$RUNNER_TEMP/load.log"

      - name: make dev, then check the API over HTTP
        run: |
          # Own process group, so stopping it also stops uv and the reloader's worker.
          setsid make dev > "$RUNNER_TEMP/dev.log" 2>&1 &
          dev_pid=$!
          stop_dev() {
            kill -TERM -- "-$dev_pid" 2> /dev/null || true
            wait "$dev_pid" 2> /dev/null || true
          }
          trap stop_dev EXIT

          api=http://127.0.0.1:8000
          for _ in $(seq 60); do
            curl -fsS --max-time 2 "$api/health" > /dev/null 2>&1 && break
            sleep 1
          done

          for path in /health /notes /docs; do
            code=$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' "$api$path")
            echo "GET $path -> $code"
            test "$code" = 200
          done

          page=$(curl -fsS --max-time 10 "$api/records?limit=1")
          echo "GET /records?limit=1 -> $page"
          echo "$page" | jq -e '(.items | length) == 1 and .next_after_id == .items[0].id'
          next=$(echo "$page" | jq '.next_after_id')
          second=$(curl -fsS --max-time 10 "$api/records?limit=1&after_id=$next")
          echo "$second" | jq -e --argjson after "$next" \
            '(.items | length) == 1 and .items[0].id > $after'

          stop_dev
          trap - EXIT
          if curl -fsS --max-time 2 "$api/health" > /dev/null 2>&1; then
            echo "::error::the API is still running after it was stopped"
            exit 1
          fi
          echo "FastAPI stopped"

      - name: Show the API log
        if: always()
        run: cat "$RUNNER_TEMP/dev.log" 2> /dev/null || true

      - name: Remove the Compose containers and volume created on this runner
        if: always()
        run: docker compose down -v --remove-orphans
