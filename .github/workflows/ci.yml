name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: coffee
        ports:
          - 5434:5432 # tests/conftest.py only accepts 127.0.0.1:5434/coffee_test
        options: >-
          --health-cmd "pg_isready -U postgres -d coffee"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5434/coffee
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5434/coffee_test

    defaults:
      run:
        shell: bash # -eo pipefail: a failing command before `| tee` fails the step

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python (.python-version) and the locked dependencies
        run: |
          uv python install
          uv sync --locked

      - name: Lint, format and type-check
        run: make lint

      # Every test is either marked `integration` or not, so these two steps run the
      # whole suite once. Both fail if any test was skipped.
      - name: Unit tests
        run: |
          make test-unit | tee "$RUNNER_TEMP/unit.log"
          if grep -Eq '[0-9]+ skipped' "$RUNNER_TEMP/unit.log"; then
            echo "::error::tests were skipped"; exit 1
          fi

      - name: Integration tests (rebuild coffee_test from db/init)
        run: |
          make test-integration | tee "$RUNNER_TEMP/integration.log"
          if grep -Eq '[0-9]+ skipped' "$RUNNER_TEMP/integration.log"; then
            echo "::error::tests were skipped"; exit 1
          fi

      - name: Load the dataset twice into the fresh coffee database
        run: |
          # Same as `make db-reset` on a new volume: apply db/init with the service's psql 17.
          for file in db/init/*.sql; do
            docker exec -i "${{ job.services.postgres.id }}" \
              psql -U postgres -d coffee -X -q -v ON_ERROR_STOP=1 < "$file"
          done
          make load | tee "$RUNNER_TEMP/first.log"
          grep -q "inserted 9971, updated 0, unchanged 0" "$RUNNER_TEMP/first.log"
          make load | tee "$RUNNER_TEMP/second.log"
          grep -q "inserted 0, updated 0, unchanged 9971" "$RUNNER_TEMP/second.log"
          grep -q "Rows in coffee_health: 9971" "$RUNNER_TEMP/second.log"
